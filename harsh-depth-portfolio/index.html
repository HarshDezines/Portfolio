<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Harsh Depth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one fixed "camera" over the character render; scroll drives the camera from sticker to sticker,
   and each chapter's copy sits on the side of the screen away from the sticker in focus.
   Deliberately single-theme: the page is the sage wall of the render itself. */
:root {
  --wall: #8d967e;        /* sampled from the render's border */
  --ink: #191d16;
  --ink-soft: #3d4438;
  --paper: #f4f2e8;
  --line: rgb(25 29 22 / .14);
  --cobalt: #2f4fc4;      /* vinyl colours, shared with the stickers */
  --mustard: #e3b53a;
  --pink: #f0a5b8;
  --mint: #a7d8bc;
  --f-sans: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --gutter: clamp(16px, 4vw, 48px);
  color-scheme: light;
}
html, body { background: var(--wall); color: var(--ink); }
body {
  font-family: var(--f-sans); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow-x: hidden; overflow-x: clip;
}
::selection { background: var(--mustard); color: var(--ink); }

/* ---------- camera / stage ---------- */
#stage { position: fixed; inset: 0; overflow: hidden; background: var(--wall); z-index: 0; contain: strict; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.layer { position: absolute; inset: 0; }
.layer > img.base { position: absolute; left: 0; top: 0; width: 100%; height: 100%; max-width: none; pointer-events: none; user-select: none; }
.layer.sharp {
  --fx: 640px; --fy: 800px; --fr: 4000px;
  -webkit-mask-image: radial-gradient(circle at var(--fx) var(--fy), #000 calc(var(--fr) * .72), transparent var(--fr));
          mask-image: radial-gradient(circle at var(--fx) var(--fy), #000 calc(var(--fr) * .72), transparent var(--fr));
}
.stk { position: absolute; overflow: visible; pointer-events: none;
  transform: translate(var(--dx, 0px), var(--dy, 0px)) translate(-50%, -50%) perspective(420px) rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg)) rotate(calc(var(--rot, 0deg) + var(--drot, 0deg))); }
/* stickers on skin: no lift shadow, tilted with the cheek, and the cheek's own light printed through them */
.stk.face { isolation: isolate; }
.stk.face svg, .stk.face .skin { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; overflow: visible; }
.stk.face .skin { mix-blend-mode: multiply; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
.sharp .stk { filter: drop-shadow(0 3px 2px rgb(20 24 16 / .35)); }
.sharp .stk.face { filter: drop-shadow(0 .5px .45px rgb(80 40 25 / .5)); }
.blur .stk { filter: blur(7px); }

/* eye rig: inpainted eye-white plate + real iris cut-out, clipped by an eyeball mask */
.eye { position: absolute; visibility: hidden; pointer-events: none; }
.eye.ready { visibility: visible; }
.eye img { position: absolute; max-width: none; user-select: none; }
.eye .plate { inset: 0; width: 100%; height: 100%; }
.eye .ball { position: absolute; inset: 0; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
.eye .iris { will-change: transform; }
.eye .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgb(70 45 30 / .32), transparent 34%); }
.eye .eyelid { left: 0; will-change: transform; }
/* flames: screen-space canvas above the wall, cut away wherever the character or a sticker is */
#flames { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; display: block; max-width: none; pointer-events: none; }
/* face warp: a WebGL copy of the head region that bends a few pixels for head lean and brow lift */
.facewarp { position: absolute; display: block; max-width: none; pointer-events: none; }
.blur .eye { filter: blur(6px); }

.grain {
  position: fixed; inset: -120px; z-index: 1; pointer-events: none; opacity: .2;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .08  0 0 0 0 .09  0 0 0 0 .07  0 0 0 2.2 -1.05'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain 1.1s steps(6) infinite;
}
@keyframes grain {
  0% { transform: translate(0, 0); } 20% { transform: translate(-42px, 18px); } 40% { transform: translate(28px, -34px); }
  60% { transform: translate(-16px, 40px); } 80% { transform: translate(38px, 12px); } 100% { transform: translate(0, 0); }
}

/* ---------- interface ---------- */
.mono { font-family: var(--f-mono); font-size: 11px; line-height: 1.4; letter-spacing: .05em; text-transform: uppercase; font-weight: 400; }
.topbar {
  position: fixed; z-index: 3; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) var(--gutter) 0;
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px; pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { font-weight: 500; letter-spacing: .08em; }
.index { display: flex; gap: clamp(8px, 1.6vw, 22px); list-style: none; margin: 0; padding: 0; }
.index button {
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink-soft);
  background: none; border: 0; padding: 4px 0; cursor: pointer; display: flex; gap: 6px; align-items: baseline;
  border-bottom: 1px solid transparent; transition: color .2s, border-color .2s;
}
.index button:hover { color: var(--ink); }
.index button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--ink); }
.index .n { font-variant-numeric: tabular-nums; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 3px; border-radius: 2px; }

.hero {
  position: fixed; z-index: 2; left: calc(var(--gutter) + 3.5vw); top: 50%; translate: 0 -50%;
  width: min(30rem, 34vw); display: grid; gap: 18px;
}
.hero h1 {
  margin: 0; font-weight: 800; font-size: clamp(2.6rem, 1.4rem + 4vw, 5.2rem);
  line-height: .95; letter-spacing: -.04em; text-wrap: balance;
}
.hero p { margin: 0; font-size: 1.0625rem; line-height: 1.55; max-width: 30ch; color: var(--ink); text-wrap: pretty; }
.cue {
  position: fixed; z-index: 2; left: var(--gutter); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: flex; align-items: center; gap: 12px; color: var(--ink);
}
.cue i { display: block; width: 48px; height: 1px; background: var(--ink); transform-origin: left; animation: cue 2.4s ease-in-out infinite; }
@keyframes cue { 0%, 100% { transform: scaleX(.25); } 50% { transform: scaleX(1); } }

#story { position: relative; z-index: 0; height: calc(var(--units, 11) * 100vh); height: calc(var(--units, 11) * 100lvh); }

/* desktop: compact cards placed next to their sticker by script (via `translate`) */
.panel {
  position: fixed; z-index: 2; left: 0; top: 0;
  width: clamp(250px, 19vw, 300px); max-height: calc(100vh - 100px); overflow: auto;
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 10px 28px rgb(25 29 22 / .18); box-sizing: border-box;
  padding: 16px 18px 18px; display: grid; gap: 8px;
  visibility: hidden; opacity: 0;
}
.panel .eyebrow { color: var(--ink-soft); display: flex; justify-content: space-between; gap: 12px; }
.panel h2 { margin: 0; font-weight: 700; font-size: 1.375rem; line-height: 1.12; letter-spacing: -.02em; text-wrap: balance; }
.panel p { margin: 0; max-width: 60ch; color: var(--ink-soft); font-size: .875rem; line-height: 1.5; text-wrap: pretty; }
.rows { list-style: none; margin: 2px 0 0; padding: 0; display: grid; border-top: 1px solid var(--line); font-size: .8125rem; line-height: 1.35; }
.rows li { display: grid; grid-template-columns: 5.6rem 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.panel .chips li { font-size: .8125rem; padding: 3px 10px; }
.panel .chips { gap: 6px; }
.panel .mail { padding: 8px 0; gap: 8px 10px; }
.panel .mail #email { font-size: .9375rem; }
#leader { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: visible; }
#leader line { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 4; stroke-linecap: round; }
#leader circle { fill: var(--ink); }
.rows li > * { min-width: 0; }
.rows .k { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.rows .v { font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
.rows.industries { counter-reset: none; }
.rows.industries li { grid-template-columns: 2.2rem 1fr; padding: 5px 0; }
.panel .closing { color: var(--ink-soft); font-size: 10.5px; margin-top: 2px; }
.rows.projects li { display: block; }
.rows .row-static, .rows .row-link { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; color: var(--ink); text-decoration: none; }
.rows .row-static { cursor: default; }
.rows .row-link:hover b { text-decoration: underline; text-underline-offset: 3px; }
.rows .v b { font-weight: 600; }
.rows .arrow { color: var(--ink-soft); }
.rows b { font-weight: 600; }
.rows span.sub { color: var(--ink-soft); }
.rows a { color: var(--ink); text-decoration: none; display: flex; justify-content: space-between; gap: 8px; }
.rows a:hover b { text-decoration: underline; text-underline-offset: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 0; padding: 0; list-style: none; }
.chips li { border: 1px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-size: .9375rem; }
.mail { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 0; border-block: 1px solid var(--line); }
.mail #email { font-size: 1.0625rem; font-weight: 600; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.mail #email:hover { text-decoration: underline; text-underline-offset: 3px; }
.mail button {
  font: inherit; font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  background: var(--ink); color: var(--paper); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.links a { color: var(--ink); font-weight: 500; font-size: .875rem; }
.panel .stat { color: var(--ink); font-size: 11px; line-height: 1.4; font-weight: 500; margin: 2px 0 0; }
/* secondary action under the project list */
.more { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px;
  border: 1px solid var(--ink); border-radius: 999px; padding: 9px 16px; color: var(--ink); text-decoration: none; font-weight: 500; }
.more:hover { background: var(--ink); color: var(--paper); }
/* contact rows: label · value · action, sharing the same left and right edges as the other cards */
/* each row: small label left, its action right, the value on its own line underneath */
.rows.contact li { grid-template-columns: 1fr auto; grid-template-areas: "k act" "v v"; gap: 2px 10px; align-items: center; padding: 8px 0; }
.rows.contact li:not(.email-row) { display: block; padding: 0; }
.rows.contact .social { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "k act" "v v"; gap: 2px 10px; align-items: center; padding: 8px 0; color: var(--ink); text-decoration: none; }
.rows.contact .k { grid-area: k; }
.rows.contact .v { grid-area: v; font-size: .9375rem; font-weight: 600; }
.rows.contact .copy, .rows.contact .arrow { grid-area: act; justify-self: end; }
.rows.contact #email { color: var(--ink); text-decoration: none; min-width: 0; overflow-wrap: normal; white-space: nowrap; }
.rows.contact #email:hover, .rows.contact .social:hover .v { text-decoration: underline; text-underline-offset: 3px; }
.rows.contact .copy { font-size: 10px; background: transparent; color: var(--ink); border: 1px solid var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer; letter-spacing: .05em; }
.rows.contact .copy:hover { background: var(--ink); color: var(--paper); }
.cta { display: block; text-align: center; background: var(--ink); color: var(--paper); text-decoration: none;
  border-radius: 999px; padding: 10px 16px; font-weight: 500; }
.cta:hover { background: var(--ink-soft); }
.mail button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }

/* phone */
@media (max-width: 720px) {
  .index .label { display: none; }
  .hero { top: calc(env(safe-area-inset-top, 0px) + 64px); translate: none; right: var(--gutter); width: auto; gap: 10px; }
  .hero h1 { font-size: clamp(2.3rem, 10vw, 3.2rem); }
  .hero p { font-size: 1rem; }
  .panel, .panel[data-side] {
    top: auto; translate: none !important; left: 16px; right: 16px; width: auto;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); max-height: 60vh; padding: 18px; gap: 8px;
  }
  .rows li { grid-template-columns: 6rem 1fr; gap: 12px; align-items: baseline; }
  .hero { left: var(--gutter); }
  .rows.industries li { padding: 4px 0; }
  .panel h2 { font-size: 1.3rem; }
  #leader { display: none; }
}

/* no-animation fallback (GSAP missing): panels become a normal reading column */
html.static #story { height: auto; padding: 100vh 16px 40px; display: grid; justify-items: center; gap: 24px; }
html.static .panel { position: relative; inset: auto; translate: none; visibility: visible; opacity: 1; width: min(32rem, 100%); max-height: none; }

@media (prefers-reduced-motion: reduce) {
  .grain, .cue i { animation: none; }
}
</style>

<div id="stage" aria-hidden="true">
  <div class="world" id="world">
    <div class="layer blur" id="layer-blur"><img class="base" src="assets/character-blur.webp" alt="" decoding="async"></div>
    <div class="layer sharp" id="layer-sharp"><img class="base" src="assets/character.webp" alt="" decoding="async" fetchpriority="high"></div>
  </div>
  <canvas id="flames"></canvas>
</div>
<div class="grain" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="sticker-defs"></defs></svg>

<header class="topbar">
  <span class="brand mono" id="brand"></span>
  <nav aria-label="Chapters"><ol class="index mono" id="index"></ol></nav>
</header>

<section class="hero" id="hero">
  <span class="mono" id="hero-eyebrow"></span>
  <h1 id="hero-title"></h1>
  <p id="hero-lede"></p>
</section>
<div class="cue mono" id="cue"><i></i><span>Scroll to look closer</span></div>

<svg id="leader" aria-hidden="true"><line id="leader-line" x1="0" y1="0" x2="0" y2="0" opacity="0"></line><circle id="leader-dot" r="3" cx="0" cy="0" opacity="0"></circle></svg>
<main id="story"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(() => {
"use strict";

/* =====================================================================
   1. CONTENT — edit everything here. Coordinates are in pixels of the
      character image (1277 × 1232; the world below y=1232 is extended shirt).
   ===================================================================== */
const SITE = {
  brand: "Harsh Goyal",                       // top-left label (shown in capitals)
  name: "Harsh Depth",                        // hero heading
  tagName: "Harsh",                           // printed on the HELLO sticker
  role: "3D artist & digital designer",       // hero eyebrow (shown in capitals)
  lede: "I create striking visuals through 3D, CGI, and motion. Scroll to explore my work.",
  badge: { big: "6+", small: "YEARS" },       // the scalloped sticker
  email: "harshdezines@gmail.com",
  instagram: "https://www.instagram.com/harshdepth/",
  linkedin: "https://www.linkedin.com/in/harsh-goyal-b4079b301",
};

const WORLD = {
  width: 1277, height: 1692, groundY: 1232,         // groundY = bottom of the original render
  image: "assets/character.webp", imageBlur: "assets/character-blur.webp",
};

/* camera framing for the opening shot */
const HERO = {
  desktop: { u: 638.5, v: 1232, x: 0.62, y: 1, zoom: 1 },
  mobile:  { u: 638.5, v: 1232, x: 0.5,  y: 1, zoom: 1 },
};

/* Stickers live on the character/world. size = rendered width in image px.
   onFace: the sticker rides along with the head-lean / brow gestures. */
const STICKERS = {
  hello:     { x: 560, y: 990,  size: 170, rot: -8 },
  badge:     { x: 805, y: 1082, size: 176, rot: 11 },
  window:    { x: 300, y: 1100, size: 150, rot: -6 },
  coffee:    { x: 750, y: 549,  size: 92,  rot: 10,  onFace: true, tilt: { y: 26, x: -7 } },   // tilt follows the cheek's curve (degrees)
  envelope:  { x: 500, y: 575,  size: 100, rot: -12, onFace: true, tilt: { y: -28, x: -7 } },
};

/* One entry per chapter, each tied to a sticker.
   Desktop: the camera pushes in around the sticker (`push`, keeping it where it sits in the opening shot)
   and racks focus onto it; the card goes on `card.side` (left / right / above / below) of the sticker.
   `card.align` slides it along that side: for left/right, 0 = card top level with the sticker centre,
   1 = card bottom level with it; for above/below, 0 = card's left edge at the centre, 1 = its right edge.
   If that spot would cover the sticker or the hero text, the next clear side is used.
   Phone: the camera zooms to the sticker (`mobile.zoom`) and puts it at `mobile.screen`; the card is a bottom sheet.
   `scroll.travel` / `scroll.hold` are lengths in viewport heights. */
const CHAPTERS = [
  {
    id: "about", label: "About", sticker: "hello",
    card: { side: "left", align: 0.85 }, push: 1.75,
    mobile: { zoom: 2.4, screen: { x: 0.5, y: 0.28 } },
    scroll: { travel: 1, hold: 1.1 },
    heading: "Hi, I'm Harsh.",
    text: "I create striking 3D visuals, CGI product renders, and motion experiences for brands. I combine design and storytelling to turn ideas into visuals that stand out.",
    rows: [["Based in", "Mumbai, India"], ["Focus", "3D · CGI · Motion Design"], ["Currently", "Open to freelance projects"]],
  },
  {
    id: "experience", label: "Experience", sticker: "badge",
    card: { side: "right", align: 0.85 }, push: 1.75,
    mobile: { zoom: 2.6, screen: { x: 0.5, y: 0.27 } },
    scroll: { travel: 1, hold: 1.1 },
    heading: "Different industries. One creative vision.",
    text: "I've collaborated with brands and creators across industries, creating visuals that bring products, identities, and ideas to life.",
    industries: ["Fashion & Footwear", "Fitness & Supplements", "Crypto & Web3", "Tech & Streaming", "Vape & Lifestyle", "Music Artists & YouTube Creators"],
    stat: "6+ years of experience",
    closing: "And much more — across design, CGI & motion",
  },
  {
    id: "work", label: "Work", sticker: "window",
    card: { side: "left", align: 0.75 }, push: 1.75,
    mobile: { zoom: 2.8, screen: { x: 0.5, y: 0.27 } },
    scroll: { travel: 1, hold: 1.1 },
    heading: "Selected work.",
    text: "A selection of projects across CGI, design, and motion. Explore the work behind the visuals.",
    // add a `url` to a row to make it a link; rows without one stay inactive
    projects: [["Project One", "CGI & Product Visuals"], ["Project Two", "Brand Identity"], ["Project Three", "3D Animation"], ["Project Four", "Campaign Visuals"]],
    more: { label: "More work on Instagram", url: SITE.instagram },
  },
  {
    id: "interests", label: "Off hours", sticker: "coffee",
    card: { side: "right", align: 0.2 }, push: 1.75,
    mobile: { zoom: 3.4, screen: { x: 0.5, y: 0.3 } },
    scroll: { travel: 1, hold: 1.1 },
    heading: "Off hours.",
    text: "When I'm not creating for clients, I'm usually exploring new ideas, experimenting with 3D, or finding inspiration in the world around me.",
    chips: ["3D experiments", "Gaming", "Music", "Exploring new tech", "Visual inspiration", "Late-night ideas"],
  },
  {
    id: "contact", label: "Contact", sticker: "envelope",
    card: { side: "below", align: 0.85 }, push: 1.75,
    mobile: { zoom: 3.2, screen: { x: 0.5, y: 0.3 } },
    scroll: { travel: 1, hold: 1.4 },
    heading: "Say hi.",
    text: "Open to new projects and good conversations. Instagram is the quickest way to reach me, or drop me an email.",
    contact: true,
  },
];
const HERO_HOLD = 0.5, END_PAD = 0.2, RACK_RADIUS = 720;

/* Eye geometry measured from the render (image px). Assets are prepared offline:
   plate = eye white with the iris painted out, iris = the original iris cut out, mask = eyeball shape. */
const EYE_RIG = [
  { id: "left",  box: [510, 432, 108, 72], center: [564, 468], radii: [44, 26],   iris: [572, 471],   irisR: 19.5, irisSize: 45, lidLift: 60 },
  { id: "right", box: [693, 435, 107, 72], center: [747, 471], radii: [43.5, 26], iris: [740, 475.5], irisR: 19.5, irisSize: 45, lidLift: 60 },
];

/* Facial gestures (image px / degrees). All subtle by design; set any amount to 0 to switch it off.
   The warp box must sit inside fully opaque pixels of the render; the margin is where motion fades to zero. */
const FACE = {
  warpBox: [290, 150, 700, 720],           // x, y, w, h of the region that can bend (head, ears, upper neck)
  warpMargin: 90,
  pivot: [638, 870],                       // head tilts around the base of the neck
  head: { x: 4, y: 2.5, rot: 1.1 },        // max lean toward the cursor
  brow: { center: [655, 392], halfWidth: 215, top: [330, 372], bottom: [408, 428], lift: 4.5 },
  blink: { idleMin: 2.8, idleMax: 6.5, fastSpeed: 2400, cooldown: 1.4 },
  lidDrop: 5,                              // upper lids follow the eyes down, in px
};

/* Flames along the bottom and side edges. Heights are fractions of the viewport height;
   reach = how far in from that edge the side fire extends (fraction of width). */
const FLAMES = {
  colors: { outline: "#c4432e", outer: "#e7664a", mid: "#f08a50", inner: "#f6ab68", core: "#fad394" },
  desktop: { left: 0.28, right: 0.40, floor: 0.03, leftReach: 0.30, rightReach: 0.26, tongue: [0.06, 0.2], spacing: [84, 132], widthMul: [1.25, 1.75], embers: 18 },

/* =====================================================================
   3. GAZE TRACKER — renderer-agnostic. It only knows "where is the viewer's
      pointer" and "which way should something at point P look". A future 3D
      character can call solve() and turn the vector into bone rotations.
   ===================================================================== */
function createGazeTracker({ releaseDelay = 1200 } = {}) {
  const state = { x: 0, y: 0, active: false, kind: "none", speed: 0, t: 0, since: 0 };
  let timer = 0;
  const set = (e) => {
    const now = performance.now(), dt = Math.max(8, now - state.t);
    if (state.active && state.t) {
      const v = Math.hypot(e.clientX - state.x, e.clientY - state.y) / (dt / 1000);
      state.speed = state.speed * 0.6 + v * 0.4;                // smoothed px/s
    } else { state.speed = 0; state.since = now; }               // (re)entered: remember when
    state.x = e.clientX; state.y = e.clientY; state.t = now; state.active = true; state.kind = e.pointerType || "mouse"; clearTimeout(timer);
  };
  const release = (delay) => { clearTimeout(timer); timer = setTimeout(() => { state.active = false; }, delay); };
  const onUp = (e) => { if (e.pointerType !== "mouse") release(releaseDelay); };
  const onCancel = () => release(releaseDelay);
  const onOut = (e) => { if (!e.relatedTarget && e.pointerType === "mouse") release(120); };
  const onBlur = () => release(0);
  const onDocOut = (e) => { if (!e.relatedTarget) release(120); };
  window.addEventListener("pointermove", set, { passive: true });
  window.addEventListener("pointerdown", set, { passive: true });
  window.addEventListener("pointerup", onUp, { passive: true });
  window.addEventListener("pointercancel", onCancel, { passive: true });
  window.addEventListener("pointerout", onOut, { passive: true });
  document.addEventListener("mouseout", onDocOut, { passive: true });
  window.addEventListener("blur", onBlur);
  return {
    /** current target in viewport px, or null when nothing is being pointed at */
    target: () => (state.active ? { x: state.x, y: state.y } : null),
    /** pointer speed in px/s, decaying to 0 once the pointer stops */
    speed: () => (state.active ? state.speed * Math.exp(-(performance.now() - state.t) / 120) : 0),
    /** ms timestamp of the moment the pointer last became active (0 if never) */
    activeSince: () => (state.active ? state.since : 0),
    /** unit-disk look vector from `from` toward `to`; `reach` = distance (px) at which the look is at full strength */
    solve(from, to, reach) {
      const dx = to.x - from.x, dy = to.y - from.y, d = Math.hypot(dx, dy);
      if (d < 1e-3) return { x: 0, y: 0 };
      let t = Math.min(d / reach, 1); t = t * t * (3 - 2 * t);
      return { x: (dx / d) * t, y: (dy / d) * t };
    },
    destroy() {
      clearTimeout(timer);
      window.removeEventListener("pointermove", set); window.removeEventListener("pointerdown", set);
      window.removeEventListener("pointerup", onUp); window.removeEventListener("pointercancel", onCancel);
      window.removeEventListener("pointerout", onOut); document.removeEventListener("mouseout", onDocOut);
      window.removeEventListener("blur", onBlur);
    },
  };
}

/* =====================================================================
   4. EYE RIG — DOM for the 2D render. Mounted once per layer (sharp + blurred)
      so the out-of-focus copy of the face moves with the in-focus one.
   ===================================================================== */
/* how far the upper lid slides to shut: its lash line comes to rest along the lower lid */
const lidTravelOf = (e) => 2 * e.radii[1] + 4;
function mountEyeRig(layer, eyes) {
  const nodes = eyes.map((e) => {
    const [x0, y0, w, h] = e.box, S = e.irisSize;

    const ecx = e.center[0] - x0, ecy = e.center[1] - y0, [rx, ry] = e.radii;
    // feather the plate just outside the eyeball so the warped face underneath blends in without a seam
    const feather = `radial-gradient(ellipse ${rx + 9}px ${ry + 9}px at ${ecx}px ${ecy}px, #000 ${((rx + 3) / (rx + 9) * 100).toFixed(1)}%, transparent 100%)`;
    // the lid gets a slightly larger clip than the eyeball so a closed eye leaves no pale rim
    const lidClip = `radial-gradient(ellipse ${rx + 9}px ${ry + 9}px at ${ecx}px ${ecy}px, #000 85%, transparent 100%)`;
    el.style.transformOrigin = `${ecx}px ${ecy}px`;
    el.innerHTML = `<img class="plate" alt="" src="assets/eye-${e.id}-plate.webp" style="-webkit-mask-image:${feather};mask-image:${feather}">
      <div class="ball" style="-webkit-mask-image:url(assets/eye-${e.id}-mask.png);mask-image:url(assets/eye-${e.id}-mask.png)">
        <img class="iris" alt="" src="assets/eye-${e.id}-iris.png" style="width:${S}px;height:${S}px;left:${e.iris[0] - x0 - S / 2}px;top:${e.iris[1] - y0 - S / 2}px">
        <div class="shade"></div></div>
      <div class="ball" style="-webkit-mask-image:${lidClip};mask-image:${lidClip}">
        <img class="eyelid" alt="" src="assets/eye-${e.id}-lid.png" style="width:${w}px;height:${h + e.lidLift}px;top:${-e.lidLift}px"></div>`;
    layer.appendChild(el);

  });

    nodes,
    show() { nodes.forEach((n) => n.el.classList.add("ready")); },
    remove() { nodes.forEach((n) => n.el.remove()); },
    set(i, dx, dy) { nodes[i].iris.style.transform = `translate3d(${dx.toFixed(2)}px,${dy.toFixed(2)}px,0)`; },
    /** closure 0 = open (the render's own lid), 1 = fully shut */
    setLid(i, closure) {

    },
    /** move the whole eye with the head warp: translate in image px, rotate in degrees */

function preloadEyeAssets(eyes) {

/* =====================================================================
   4b. FACE GESTURES — pure state, no DOM. Feed it the look vector from the
       gaze tracker; it returns head lean, brow lift, lid drop and blink.
       A 3D rig can map the same numbers onto bones or blend shapes.
   ===================================================================== */
const smooth01 = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function createFaceGestures(cfg, random = Math.random) {
  const CLOSE = 0.075, HOLD = 0.035, OPEN = 0.13;
  const s = { hx: 0, hy: 0, rot: 0, brow: 0, kick: 0, attn: 0, lidDrop: 0, blink: 0, blinkT: -1, cooldown: 0, pending: 0, double: false,
              nextIdle: cfg.blink.idleMin + random() * (cfg.blink.idleMax - cfg.blink.idleMin) };
  const start = (force) => {
    if (s.blinkT >= 0 || (!force && s.cooldown > 0)) return;
    s.blinkT = 0; s.cooldown = cfg.blink.cooldown; s.double = random() < 0.15;
  };
  return {
    state: s,
    blink: () => start(true),
    /** inp: { look: {x,y}|null, eyeLookY, speed (px/s), active, justActivated, reduce } */
    update(dt, inp) {
      const k = (rate) => 1 - Math.exp(-dt * rate);
      const L = !inp.reduce && inp.look ? inp.look : { x: 0, y: 0 };
      // head lean toward the cursor, lagging behind the eyes
      s.hx += (L.x * cfg.head.x - s.hx) * k(3.2);
      s.hy += (L.y * cfg.head.y - s.hy) * k(3.2);
      s.rot += (L.x * cfg.head.rot - s.rot) * k(2.6);
      // brows: a little lift while someone is pointing, more on quick movements and when looking up
      s.attn += ((inp.active ? 1 : 0) - s.attn) * k(2);
      if (inp.speed > cfg.blink.fastSpeed * 0.6) s.kick = Math.min(1, s.kick + dt * 6);
      s.kick *= Math.exp(-dt * 2.2);
      const up = Math.max(0, -inp.eyeLookY), down = Math.max(0, inp.eyeLookY);
      const browGoal = inp.reduce ? 0 : cfg.brow.lift * Math.min(1, 0.22 * s.attn + 0.6 * s.kick + 0.35 * up);
      s.brow += (browGoal - s.brow) * k(6);
      // upper lids follow the eyes downward
      s.lidDrop += (down - s.lidDrop) * k(8);
      // blinks: idle rhythm, on quick cursor sweeps, and when the pointer arrives
      s.cooldown = Math.max(0, s.cooldown - dt);
      s.nextIdle -= dt;
      if (s.nextIdle <= 0) { start(false); s.nextIdle = cfg.blink.idleMin + random() * (cfg.blink.idleMax - cfg.blink.idleMin); }
      if (!inp.reduce && inp.speed > cfg.blink.fastSpeed && random() < dt * 2.5) start(false);
      if (inp.justActivated) start(false);
      if (s.pending > 0) { s.pending -= dt; if (s.pending <= 0) start(true); }
      if (s.blinkT >= 0) {
        s.blinkT += dt; const t = s.blinkT;
        if (t < CLOSE) { const u = t / CLOSE; s.blink = u * u; }
        else if (t < CLOSE + HOLD) s.blink = 1;
        else if (t < CLOSE + HOLD + OPEN) { const u = (t - CLOSE - HOLD) / OPEN; s.blink = 1 - (1 - (1 - u) * (1 - u)); }
        else { s.blinkT = -1; s.blink = 0; if (s.double) { s.double = false; s.pending = 0.09; } }
      }
    },
    /** displacement (image px) the warp applies at a point — used to carry the eye rigs with the head */
    displacementAt(px, py) {
      const [bx, by, bw, bh] = cfg.warpBox;
      const e = Math.min(px - bx, bx + bw - px, py - by, by + bh - py), w = smooth01(0, cfg.warpMargin, e);
      const th = s.rot * Math.PI / 180, qx = px - cfg.pivot[0], qy = py - cfg.pivot[1];
      const rx = Math.cos(th) * qx - Math.sin(th) * qy - qx, ry = Math.sin(th) * qx + Math.cos(th) * qy - qy;
      return { x: w * (s.hx + rx), y: w * (s.hy + ry), w };
    },
  };
}

/* =====================================================================
   4c. FACE WARP — WebGL copy of the head region drawn over the base image.
       At rest it is pixel-identical to the render; gestures bend it by a
       few pixels, fading to zero at the region's edge so there is no seam.
   ===================================================================== */
function createFaceWarp(layer, img, cfg, imgSize) {
  const [bx, by, bw, bh] = cfg.warpBox;
  const cv = document.createElement("canvas");
  cv.width = bw; cv.height = bh; cv.className = "facewarp";
  cv.style.cssText = `left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px`;
  const gl = cv.getContext("webgl", { premultipliedAlpha: false, alpha: true, antialias: false });
  if (!gl) return null;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, `attribute vec2 a; varying vec2 vPos;
    void main(){ vPos = a; gl_Position = vec4(a.x * 2.0 - 1.0, 1.0 - a.y * 2.0, 0.0, 1.0); }`));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `precision highp float;
    varying vec2 vPos;
    uniform sampler2D uTex; uniform vec2 uImg; uniform vec4 uBox; uniform float uMargin;
    uniform vec2 uShift; uniform float uRot; uniform vec2 uPivot;
    uniform float uBrow; uniform vec2 uBrowC; uniform float uBrowHW; uniform vec4 uBrowY;
    void main(){
      vec2 p = uBox.xy + vPos * uBox.zw;
      float e = min(min(p.x - uBox.x, uBox.x + uBox.z - p.x), min(p.y - uBox.y, uBox.y + uBox.w - p.y));
      float w = smoothstep(0.0, uMargin, e);
      vec2 q = p - uPivot; float c = cos(uRot), s = sin(uRot);
      vec2 d = w * (uShift + vec2(c * q.x - s * q.y, s * q.x + c * q.y) - q);
      float wb = smoothstep(uBrowY.x, uBrowY.y, p.y) * (1.0 - smoothstep(uBrowY.z, uBrowY.w, p.y))
               * (1.0 - smoothstep(0.7, 1.0, abs(p.x - uBrowC.x) / uBrowHW));
      d.y -= wb * uBrow;
      gl_FragColor = texture2D(uTex, (p - d) / uImg);
    }`));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  for (const [p, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, p, v);
  const U = (n) => gl.getUniformLocation(prog, n);
  gl.uniform2f(U("uImg"), imgSize[0], imgSize[1]);
  gl.uniform4f(U("uBox"), bx, by, bw, bh);
  gl.uniform1f(U("uMargin"), cfg.warpMargin);
  gl.uniform2f(U("uPivot"), cfg.pivot[0], cfg.pivot[1]);
  gl.uniform2f(U("uBrowC"), cfg.brow.center[0], cfg.brow.center[1]);
  gl.uniform1f(U("uBrowHW"), cfg.brow.halfWidth);
  gl.uniform4f(U("uBrowY"), cfg.brow.top[0], cfg.brow.top[1], cfg.brow.bottom[0], cfg.brow.bottom[1]);
  const uShift = U("uShift"), uRot = U("uRot"), uBrow = U("uBrow");
  gl.viewport(0, 0, bw, bh);
  let last = "", lost = false;
  const onLost = (e) => { e.preventDefault(); lost = true; cv.remove(); console.warn("[face] WebGL context lost — head and brow gestures paused."); };
  cv.addEventListener("webglcontextlost", onLost);
  layer.querySelector("img.base").after(cv);
  return {
    get active() { return !lost; },
    draw(st) {
      if (lost) return;
      const key = `${st.hx.toFixed(2)}|${st.hy.toFixed(2)}|${st.rot.toFixed(3)}|${st.brow.toFixed(2)}`;
      if (key === last) return;
      last = key;
      gl.uniform2f(uShift, st.hx, st.hy); gl.uniform1f(uRot, st.rot * Math.PI / 180); gl.uniform1f(uBrow, st.brow);

    },
    destroy() { cv.removeEventListener("webglcontextlost", onLost); cv.remove(); gl.getExtension("WEBGL_lose_context")?.loseContext(); },
  };
}

/* =====================================================================
   4d. FLAMES — one WebGL shader. The fire is a single height field broken up
       by noise that scrolls upward forever, then cut into toon bands with a
       constant-width outline: tongues form, curl and break off on their own,
       so nothing repeats and nothing seams. The cursor heats the fire near it
       (taller, wilder licks), sweeps it sideways with its speed, and throws
       off droplets. The character and stickers are cut out in the shader.
   ===================================================================== */
function createFlames(canvas, { matteSrc, getCam, stickers, art, world, keepClear }) {
  const gl = canvas.getContext("webgl", { premultipliedAlpha: true, alpha: true, antialias: false });
  if (!gl) { console.warn("[flames] WebGL unavailable — flames off."); return null; }
  const deriv = gl.getExtension("OES_standard_derivatives");
  const MAXE = 16, NSTK = Object.keys(stickers).length;
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);

  const FS = `${deriv ? "#extension GL_OES_standard_derivatives : enable\n" : ""}precision highp float;
uniform vec2 uView;      // viewport w,h (css px)
uniform vec2 uBand;      // canvas offset from top, dpr
uniform float uT, uL, uFloor, uLeft, uRight, uLReach, uRReach, uZf, uWind, uOutline;
uniform vec3 uPtr;       // x, y, heat
uniform float uR;
uniform vec4 uClear;     // l, t, r, b (css px); r < l when off
uniform float uGap;
uniform vec3 uCam;       // s, tx, ty
uniform vec2 uWorld;
uniform sampler2D uMatte;
uniform float uMatteOn;
uniform vec4 uS[${NSTK}];   // sticker cx, cy, half w, half h (screen px)
uniform vec2 uS2[${NSTK}];  // rotation (rad), circle flag
uniform vec4 uE[${MAXE}];   // ember x, y, size, alpha
uniform vec3 cOutline, cOuter, cMid, cInner, cCore;

vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec2 mod289(vec2 x){return x-floor(x*(1.0/289.0))*289.0;}
vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}
float snoise(vec2 v){
  const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
  vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
  vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod289(i);
  vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0); m=m*m; m=m*m;
  vec3 x=2.0*fract(p*C.www)-1.0; vec3 h=abs(x)-0.5; vec3 ox=floor(x+0.5); vec3 a0=x-ox;
  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
  vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.0*dot(m,g);
}
float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<3;i++){ s+=a*snoise(p); p=p*1.9+vec2(1.7,9.2); a*=0.42; } return s; }
float fbm2(vec2 p){ return 0.62*snoise(p)+0.26*snoise(p*1.9+vec2(5.2,1.3)); }
float fall(float u){ if(u>=1.0) return 0.0; u=max(u,0.0); return pow(1.0-u*u*(3.0-2.0*u),1.35); }
float sdBox(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r; }

void main(){
  float dpr=uBand.y;
  float x=gl_FragCoord.x/dpr, h=gl_FragCoord.y/dpr;      // h = height above the bottom of the screen
  float y=uView.y-h;
  float W=uView.x, L=uL;
  float env=uView.y*(uFloor+uLeft*fall(max(x,0.0)/(uLReach*W))+uRight*fall(max(W-x,0.0)/(uRReach*W)))*uZf;
  // cursor heat: a soft blob around the pointer
  float d2=dot(vec2(x,y)-uPtr.xy, vec2(x,y)-uPtr.xy);
  float hot=uPtr.z*exp(-d2/(uR*uR));
  // nothing can reach above this: only droplets are drawn there, and empty pixels stop right away
  bool above=h>env+L*(2.5+0.9*hot);
  vec3 col=cOuter; float a=0.0;
  if(!above){
  // curl: bend the flame sideways with height, plus cursor-driven wind
  float rel=clamp(h/(env+L*1.6),0.0,1.5);
  float xw=x+0.55*L*fbm2(vec2(h/(2.0*L)-uT*0.5, x/(2.6*L)))-uWind*h*0.35;
  // body + upward-scrolling licks; noise grows with height so tips break into tongues and droplets
  float n=fbm(vec2(xw/(0.95*L), h/(1.7*L)-uT*1.2));
  float body=(env+L*(1.0+0.55*hot)-h)/L;
  float v=body+n*(0.55+0.75*rel)*(1.0+0.6*hot);
  // keep the fire below the hero copy
  if(uClear.z>uClear.x && x>uClear.x-40.0 && x<uClear.z+40.0){
    float lim=uView.y-uClear.w-uGap;
    v-=smoothstep(lim-30.0,lim,h)*3.0;
  }
  // inner bands get their own slow noise so they don't read as copies of the outline
  float n2=fbm2(vec2(xw/(1.3*L)+11.0, h/(2.0*L)-uT*0.9));
  float depth=v/(1.0+env/L);                    // 0 at the flame edge, about 1 at the bottom of the screen
  float vi=depth+0.09*n2;
  float w=${deriv ? "max(fwidth(v),1e-4)" : "0.02"};
  a=smoothstep(-w,w,v);
  col=mix(cOutline,col,smoothstep(uOutline*w-w,uOutline*w+w,v));
  float wi=${deriv ? "max(fwidth(vi),1e-4)" : "0.02"};
  col=mix(col,cMid,smoothstep(0.2-wi,0.2+wi,vi));
  col=mix(col,cInner,smoothstep(0.46-wi,0.46+wi,vi));
  col=mix(col,cCore,smoothstep(0.78-wi,0.78+wi,vi));
  }
  // droplets
  for(int i=0;i<${MAXE};i++){
    vec4 e=uE[i]; if(e.w<=0.0) continue;
    vec2 q=(vec2(x,y)-e.xy)/e.z;
    q.y=q.y<0.0?q.y*0.55:q.y;                      // stretched upper half = pointed top
    float dd=(length(q)-0.62)*e.z;
    float ea=(1.0-smoothstep(-0.7,0.7,dd))*e.w;
    vec3 ec=mix(cOuter,cOutline,smoothstep(-1.9,-1.0,dd));
    col=mix(col,ec,ea*(1.0-a)); a=max(a,ea);
  }
  if(a<=0.001) discard;
  // cut-outs: the character (camera-projected matte) and the stickers
  if(uMatteOn>0.5){
    vec2 uv=((vec2(x,y)-uCam.yz)/uCam.x)/uWorld;
    if(uv.x>0.0&&uv.y>0.0&&uv.x<1.0&&uv.y<1.0) a*=1.0-texture2D(uMatte,uv).a;
  } else a=0.0;
  for(int i=0;i<${NSTK};i++){
    vec4 s=uS[i]; vec2 r=uS2[i];
    vec2 q=vec2(x,y)-s.xy; float c=cos(-r.x), sn=sin(-r.x); q=vec2(c*q.x-sn*q.y, sn*q.x+c*q.y);
    float sd=r.y>0.5?length(q)-s.z:sdBox(q,s.zw,s.z*0.24);
    a*=smoothstep(-0.8,0.8,sd);
  }
  gl_FragColor=vec4(col*a,a);
}`;
  const VS = "attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }";
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const ploc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(ploc); gl.vertexAttribPointer(ploc, 2, gl.FLOAT, false, 0, 0);
  const U = new Proxy({}, { get: (c, n) => (n in c ? c[n] : (c[n] = gl.getUniformLocation(prog, n))) });
  const col = FLAMES.colors;
  gl.uniform3fv(U.cOutline, hex(col.outline)); gl.uniform3fv(U.cOuter, hex(col.outer)); gl.uniform3fv(U.cMid, hex(col.mid));
  gl.uniform3fv(U.cInner, hex(col.inner)); gl.uniform3fv(U.cCore, hex(col.core));
  gl.uniform2f(U.uWorld, world.width, world.height);
  gl.uniform1i(U.uMatte, 0);

  // matte texture
  let matteReady = false;
  const tex = gl.createTexture();
  const mi = new Image();
  mi.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mi);
    for (const [p, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, p, v);
    matteReady = true;
  };
  mi.onerror = () => console.warn("[flames] matte missing — flames hidden so they never cover the character.");
  mi.src = matteSrc;

  let W = 0, H = 0, off = 0, bandH = 0, dpr = 1, cfg = FLAMES.desktop, mobile = false, t = 0, heat = 0, wind = 0, presence = 0, lost = false;
  let quality = 1, frameEma = 1 / 60, slowFor = 0, lastReal = 0;   // adaptive resolution for slower devices
  const embers = Array.from({ length: MAXE }, () => ({ alive: false })), emberBudget = { acc: 0 }, eBuf = new Float32Array(MAXE * 4);
  const sBuf = new Float32Array(NSTK * 4), s2Buf = new Float32Array(NSTK * 2);
  const ptr = { x: -9999, y: -9999, vx: 0, vy: 0, active: false, t: 0, timer: 0 };
  const fall = (u) => (u >= 1 ? 0 : Math.pow(1 - Math.max(0, u) ** 2 * (3 - 2 * Math.max(0, u)), 1.35));
  const groundPx = (x) => H * (cfg.floor + cfg.left * fall(Math.max(0, x) / (cfg.leftReach * W)) + cfg.right * fall(Math.max(0, W - x) / (cfg.rightReach * W)));

  function resize(w, h) {
    mobile = w <= 720; cfg = mobile ? FLAMES.mobile : FLAMES.desktop;
    dpr = Math.min(window.devicePixelRatio || 1, mobile ? FLAMES.maxDprMobile : FLAMES.maxDpr) * quality;
    W = w; H = h; bandH = Math.round(h * FLAMES.band); off = h - bandH;
    canvas.style.height = bandH + "px";
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(bandH * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  const onMove = (e) => {
    const now = performance.now(), dt = Math.max(8, now - ptr.t) / 1000;
    if (ptr.active) { ptr.vx = ptr.vx * 0.7 + ((e.clientX - ptr.x) / dt) * 0.3; ptr.vy = ptr.vy * 0.7 + ((e.clientY - ptr.y) / dt) * 0.3; }
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.t = now; ptr.active = true; clearTimeout(ptr.timer);
  };
  const onEnd = (e) => { if (e.pointerType !== "mouse") { clearTimeout(ptr.timer); ptr.timer = setTimeout(() => { ptr.active = false; }, 700); } };
  const onLeave = (e) => { if (!e.relatedTarget) ptr.active = false; };
  const onLost = (e) => { e.preventDefault(); lost = true; canvas.style.display = "none"; console.warn("[flames] WebGL context lost — flames off."); };
  window.addEventListener("pointermove", onMove, { passive: true });
  window.addEventListener("pointerdown", onMove, { passive: true });
  window.addEventListener("pointerup", onEnd, { passive: true });
  window.addEventListener("pointercancel", onEnd, { passive: true });
  document.addEventListener("mouseout", onLeave, { passive: true });
  canvas.addEventListener("webglcontextlost", onLost);

  function spawn(x, y, boost) {
    const e = embers.find((m) => !m.alive); if (!e) return;
    Object.assign(e, { alive: true, x, y, vx: (Math.random() - 0.5) * 24 + wind * 60, vy: -(30 + Math.random() * 50) * (1 + boost * 0.8),
      age: 0, life: 1.8 + Math.random() * 2, s: (mobile ? 4 : 5) + Math.random() * (mobile ? 3 : 5), ph: Math.random() * 6.283, alpha: 0 });
  }

  return {
    resize,
    frame(dt, reduce) {
      if (!W || !H || lost) return;
      // if the page keeps running slow, render the fire at a lower resolution (never below half)
      const nowReal = performance.now(), realDt = lastReal ? Math.min(1, (nowReal - lastReal) / 1000) : 1 / 60;
      lastReal = nowReal;
      frameEma += (realDt - frameEma) * 0.08;
      slowFor = frameEma > 1 / 36 ? slowFor + realDt : Math.max(0, slowFor - realDt * 0.5);
      if (slowFor > 1.5 && quality > 0.5) { quality = Math.max(0.5, quality * 0.75); slowFor = 0; resize(W, H); }
      const cam = getCam(), zf = 1 - (1 - FLAMES.zoomedScale) * smooth01(1, 1.6, cam.k);
      if (!reduce) t += dt;
      const L = H * (cfg.tongue[0] + cfg.tongue[1]) * 0.5 * (mobile ? 1.15 : 1.05);
      const R = FLAMES.hoverRadius * (mobile ? 0.75 : 1);
      presence += ((ptr.active ? 1 : 0) - presence) * (1 - Math.exp(-dt * 6));
      let near = 0;
      if (ptr.active) near = Math.exp(-Math.pow(Math.max(0, (H - ptr.y) - (groundPx(ptr.x) * zf + L)) / R, 2));
      heat += (near - heat) * (1 - Math.exp(-dt * 5));
      const speed = Math.hypot(ptr.vx, ptr.vy);
      wind += ((ptr.active ? Math.max(-1, Math.min(1, ptr.vx / 1600)) * heat : 0) - wind) * (1 - Math.exp(-dt * 3));
      ptr.vx *= Math.exp(-dt * 4); ptr.vy *= Math.exp(-dt * 4);

      // droplets: idle drift up the sides, extra bursts where the cursor stirs the fire
      eBuf.fill(0);
      if (!reduce) {
        emberBudget.acc += dt * (cfg.embers / 3 + (ptr.active ? Math.min(16, speed / 120) * heat : 0));
        while (emberBudget.acc >= 1) {
          emberBudget.acc -= 1;
          let x;
          if (ptr.active && heat > 0.2 && Math.random() < 0.6) x = ptr.x + (Math.random() - 0.5) * R;
          else x = Math.random() < 0.5 ? Math.random() * cfg.leftReach * W * 0.8 : W - Math.random() * cfg.rightReach * W * 0.8;
          spawn(x, H - groundPx(x) * zf - L * (0.8 + Math.random() * 0.9), heat);
        }
        let k = 0;
        for (const e of embers) {
          if (!e.alive) continue;
          e.age += dt; if (e.age >= e.life || e.y < off) { e.alive = false; continue; }
          e.x += (e.vx + Math.sin(e.ph + t * 1.8) * 14) * dt; e.y += e.vy * dt;
          let al = Math.min(1, e.age / 0.25) * Math.min(1, (e.life - e.age) / (e.life * 0.4)) * smooth01(off + 10, off + 70, e.y);
          if (clear && e.x > clear.left - 12 && e.x < clear.right + 12 && e.y > clear.top - 12 && e.y < clear.bottom + 12) al *= 0.2;
          eBuf.set([e.x, e.y, e.s * (1 - 0.4 * e.age / e.life), al], k * 4); k++;

      // sticker cut-outs in screen space
      Object.entries(stickers).forEach(([id, st], i) => {
        const a = art[id], w = st.size * cam.s, h = w * a.vb[3] / a.vb[2], circle = id === "coffee" || id === "badge";
        sBuf.set([st.x * cam.s + cam.tx, st.y * cam.s + cam.ty, (circle ? w / 2 : w / 2) + 1, h / 2 + 1], i * 4);
        s2Buf.set([st.rot * Math.PI / 180, circle ? 1 : 0], i * 2);
      });

      gl.uniform2f(U.uView, W, H); gl.uniform2f(U.uBand, off, dpr);
      gl.uniform1f(U.uT, t); gl.uniform1f(U.uL, L); gl.uniform1f(U.uZf, zf);
      gl.uniform1f(U.uFloor, cfg.floor); gl.uniform1f(U.uLeft, cfg.left); gl.uniform1f(U.uRight, cfg.right);
      gl.uniform1f(U.uLReach, cfg.leftReach); gl.uniform1f(U.uRReach, cfg.rightReach);
      gl.uniform1f(U.uWind, wind); gl.uniform1f(U.uOutline, 2.6 * dpr);
      gl.uniform3f(U.uPtr, ptr.x, ptr.y, presence * (reduce ? 0.5 : 1)); gl.uniform1f(U.uR, R);
      if (clear) gl.uniform4f(U.uClear, clear.left, clear.top, clear.right, clear.bottom); else gl.uniform4f(U.uClear, 1, 0, 0, 0);
      gl.uniform1f(U.uGap, FLAMES.textGap);
      gl.uniform3f(U.uCam, cam.s, cam.tx, cam.ty);
      gl.uniform1f(U.uMatteOn, matteReady ? 1 : 0);
      gl.uniform4fv(U["uS[0]"], sBuf); gl.uniform2fv(U["uS2[0]"], s2Buf); gl.uniform4fv(U["uE[0]"], eBuf);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    },
    debug: () => ({ heat, wind, presence, quality, embers: embers.filter((e) => e.alive).length, ready: matteReady }),
    destroy() {
      window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerdown", onMove);
      window.removeEventListener("pointerup", onEnd); window.removeEventListener("pointercancel", onEnd);
      document.removeEventListener("mouseout", onLeave); canvas.removeEventListener("webglcontextlost", onLost);
      clearTimeout(ptr.timer); gl.getExtension("WEBGL_lose_context")?.loseContext();
    },
  };
}

});

/* =====================================================================
   6. CAMERA — a single state object. GSAP tweens it; the render loop draws it.
   ===================================================================== */
const view = { w: innerWidth, h: innerHeight, lvh: innerHeight, s0: 1, mobile: false };
const cam = { u: HERO.desktop.u, v: HERO.desktop.v, sx: HERO.desktop.x, sy: HERO.desktop.y, k: 1, fr: 4000 };
const lvhProbe = document.createElement("div");
lvhProbe.style.cssText = "position:fixed;top:0;left:0;width:0;height:100vh;height:100lvh;visibility:hidden;pointer-events:none";
document.body.appendChild(lvhProbe);

function measure() {
  view.w = document.documentElement.clientWidth || innerWidth;
  view.h = innerHeight;
  view.lvh = lvhProbe.offsetHeight || innerHeight;
  view.mobile = view.w <= 720;
  view.s0 = view.mobile
    ? Math.min(view.lvh * 0.74 / WORLD.groundY, view.w * 1.5 / WORLD.width)
    : Math.min(view.lvh * 0.95 / WORLD.groundY, view.w * 0.75 / WORLD.width);
}
measure();

let lastCam = "";
const camScreen = { s: 1, tx: 0, ty: 0 };
function applyCamera() {
  const s = view.s0 * cam.k, tx = cam.sx * view.w - cam.u * s, ty = cam.sy * view.h - cam.v * s;
  camScreen.s = s; camScreen.tx = tx; camScreen.ty = ty;
  const key = `${tx.toFixed(2)}|${ty.toFixed(2)}|${s.toFixed(5)}|${cam.fr.toFixed(1)}|${cam.u.toFixed(1)}|${cam.v.toFixed(1)}`;
  if (key === lastCam) return;
  lastCam = key;
  world.style.transform = `translate3d(${tx.toFixed(2)}px,${ty.toFixed(2)}px,0) scale(${s.toFixed(5)})`;
  sharp.style.setProperty("--fx", cam.u.toFixed(1) + "px");
  sharp.style.setProperty("--fy", cam.v.toFixed(1) + "px");
  sharp.style.setProperty("--fr", cam.fr.toFixed(1) + "px");
}

/* =====================================================================
   7. EYES — wired to the camera so per-eye screen positions are exact
      without reading layout every frame.
   ===================================================================== */
const gaze = createGazeTracker();
let rigs = null;
const eyeState = EYE_RIG.map(() => ({ x: 0, y: 0 }));
const reduceMotionMQ = matchMedia("(prefers-reduced-motion: reduce)");
preloadEyeAssets(EYE_RIG).then(() => {
  rigs = [mountEyeRig(blur, EYE_RIG), mountEyeRig(sharp, EYE_RIG)];
  rigs.forEach((r) => r.show());
}).catch((err) => { console.warn("[eyes] tracking disabled:", err.message); });

function updateEyes(dt) {
  if (!rigs) return;
  const t = gaze.target(), reach = 0.38 * Math.min(view.w, view.h);
  const ease = 1 - Math.exp(-dt * (reduceMotionMQ.matches ? 6 : 11));
  EYE_RIG.forEach((e, i) => {
    let gx = e.iris[0], gy = e.iris[1];                       // rest = the render's original gaze
    if (t) {
      const sc = { x: e.center[0] * camScreen.s + camScreen.tx, y: e.center[1] * camScreen.s + camScreen.ty };
      const g = gaze.solve(sc, t, reach);
      const ax = e.radii[0] - e.irisR * 0.7, ay = e.radii[1] - e.irisR * 0.45;   // anatomical travel limits
      gx = e.center[0] + g.x * ax; gy = e.center[1] + g.y * ay;
    }
    const st = eyeState[i];
    const goalX = gx - e.iris[0], goalY = gy - e.iris[1];
    const nx = st.x + (goalX - st.x) * ease, ny = st.y + (goalY - st.y) * ease;
    if (Math.abs(nx - st.x) < 0.004 && Math.abs(ny - st.y) < 0.004) return;
    st.x = nx; st.y = ny;
    rigs.forEach((r) => r.set(i, nx, ny));
  });
}

/* =====================================================================
   7b. FACE — gestures layered on top of the eye tracking (which stays as is).
   ===================================================================== */
const gestures = createFaceGestures(FACE);
let warp = null, lastSince = 0;
const sharpBase = sharp.querySelector("img.base");
const startWarp = () => {
  try { warp = createFaceWarp(sharp, sharpBase, FACE, [WORLD.width, WORLD.height]); }
  catch (err) { warp = null; console.warn("[face] warp unavailable — head and brow gestures off:", err.message); }
};
if (sharpBase.complete && sharpBase.naturalWidth) startWarp(); else sharpBase.addEventListener("load", startWarp, { once: true });

function updateFace(dt) {
  if (!rigs) return;
  const t = gaze.target(), reduce = reduceMotionMQ.matches;
  let look = null;
  if (t) {   // the head leans toward the cursor from the middle of the face, a bit less eagerly than the eyes
    const hc = { x: 655 * camScreen.s + camScreen.tx, y: 470 * camScreen.s + camScreen.ty };
    look = gaze.solve(hc, t, 0.6 * Math.min(view.w, view.h));
  }
  // where the eyes currently point vertically (-1 up … 1 down), from the smoothed iris positions
  let eyeLookY = 0;
  EYE_RIG.forEach((e, i) => { eyeLookY += (eyeState[i].y + e.iris[1] - e.center[1]) / (e.radii[1] - e.irisR * 0.45) / EYE_RIG.length; });
  const since = gaze.activeSince(), justActivated = since !== 0 && since !== lastSince;
  if (since) lastSince = since;
  gestures.update(dt, { look, eyeLookY: Math.max(-1, Math.min(1, eyeLookY)), speed: gaze.speed(), active: !!t, justActivated, reduce });
  const st = gestures.state, bending = !!(warp && warp.active);
  if (bending) warp.draw(st);
  EYE_RIG.forEach((e, i) => {
    const lidTravel = lidTravelOf(e);
    const closure = Math.max(st.blink, (st.lidDrop * FACE.lidDrop) / lidTravel);
    rigs.forEach((r) => r.setLid(i, closure));
    const d = bending ? gestures.displacementAt(e.center[0], e.center[1]) : { x: 0, y: 0, w: 0 };
    rigs[1].setHead(i, d.x, d.y, st.rot * d.w * (bending ? 1 : 0));   // sharp layer only; the blurred copy stays put
  });
  // stickers stuck on the face move with it
  for (const [id, stk] of Object.entries(STICKERS)) {
    if (!stk.onFace) continue;
    const d = bending ? gestures.displacementAt(stk.x, stk.y) : { x: 0, y: 0, w: 0 };
    faceOffset[id] = d;
    const el = faceStickerEls[id] || (faceStickerEls[id] = sharp.querySelector(`.stk[data-sticker="${id}"]`));
    const key = `${d.x.toFixed(2)},${d.y.toFixed(2)},${(st.rot * d.w).toFixed(3)}`;
    if (!el || el.dataset.k === key) continue;
    el.dataset.k = key;
    el.style.setProperty("--dx", d.x.toFixed(2) + "px"); el.style.setProperty("--dy", d.y.toFixed(2) + "px"); el.style.setProperty("--drot", (st.rot * d.w).toFixed(3) + "deg");
  }
}
const faceStickerEls = {};

/* =====================================================================
   7c. FLAMES — screen-space, tucked behind the character via the camera.
   ===================================================================== */
const flamesCam = { k: 1, s: 1, tx: 0, ty: 0 };
const heroEl = document.getElementById("hero");
let heroRect = null;
let heroTextRect = null, heroLineRects = [];
const measureHero = () => {
  const r = heroEl.getBoundingClientRect(); heroRect = { left: r.left, right: r.right, top: r.top, bottom: r.bottom };
  const u = { left: Infinity, top: Infinity, right: -Infinity, bottom: -Infinity }, rg = document.createRange();
  for (const node of heroEl.children) {
    rg.selectNodeContents(node);
    for (const q of rg.getClientRects()) { u.left = Math.min(u.left, q.left); u.top = Math.min(u.top, q.top); u.right = Math.max(u.right, q.right); u.bottom = Math.max(u.bottom, q.bottom); }
  }
  heroTextRect = isFinite(u.left) ? u : heroRect;
  heroLineRects = [];
  for (const node of heroEl.children) { rg.selectNodeContents(node); for (const q of rg.getClientRects()) if (q.width > 1) heroLineRects.push([q.left, q.top, q.right, q.bottom]); }
};
const heroTextVisible = () => {
  const st = heroEl.style;
  return st.visibility === "hidden" || parseFloat(st.opacity || "1") < 0.05 ? null : heroTextRect;
};
measureHero();
document.fonts?.ready.then(measureHero);
let flames = null;
try { flames = createFlames(document.getElementById("flames"), {
  matteSrc: "assets/character-matte.png", stickers: STICKERS, art: ART, world: WORLD,
  keepClear: () => {                       // only while the hero copy is actually showing
    const st = heroEl.style;
    return st.visibility === "hidden" || parseFloat(st.opacity || "1") < 0.05 ? null : heroRect;
  },
  getCam: () => { flamesCam.k = cam.k; flamesCam.s = camScreen.s; flamesCam.tx = camScreen.tx; flamesCam.ty = camScreen.ty; return flamesCam; },
}); } catch (err) { flames = null; document.getElementById("flames").style.display = "none"; console.warn("[flames] off:", err.message); }
flames?.resize(view.w, view.h);

/* =====================================================================
   7d. CARDS — on desktop each chapter card sits beside its sticker, following
       the sticker's live screen position, with a dashed line linking them.
   ===================================================================== */
const cardSize = {}, faceOffset = {};
const leaderLine = document.getElementById("leader-line"), leaderDot = document.getElementById("leader-dot");
let cardsCleared = false, lastLeader = "";
function measureCards() {
  CHAPTERS.forEach((ch) => { const el = document.getElementById("ch-" + ch.id); if (el) cardSize[ch.id] = { w: el.offsetWidth, h: el.offsetHeight }; });
}
document.fonts?.ready.then(measureCards);
// keep sizes current whenever a card's size changes (fonts arriving, edited copy, layout switches)
const cardRO = "ResizeObserver" in window ? new ResizeObserver(measureCards) : null;
CHAPTERS.forEach((ch) => { const el = document.getElementById("ch-" + ch.id); if (el) cardRO?.observe(el); });
function stickerScreen(id) {
  const st = STICKERS[id], f = faceOffset[id] || { x: 0, y: 0 };
  return { x: (st.x + f.x) * camScreen.s + camScreen.tx, y: (st.y + f.y) * camScreen.s + camScreen.ty };
}
function stickerExtent(id, s) {
  const st = STICKERS[id], art = ART[id], w = st.size, h = w * art.vb[3] / art.vb[2];
  if (id === "coffee" || id === "badge") return { x: w / 2 * s, y: w / 2 * s };
  const t = (st.rot || 0) * Math.PI / 180, cs = Math.abs(Math.cos(t)), sn = Math.abs(Math.sin(t));
  return { x: (cs * w + sn * h) / 2 * s, y: (sn * w + cs * h) / 2 * s };
}
function positionCards() {
  if (view.mobile || document.documentElement.classList.contains("static")) {
    if (!cardsCleared) { CHAPTERS.forEach((ch) => { const el = document.getElementById("ch-" + ch.id); if (el) el.style.translate = ""; }); leaderLine.setAttribute("opacity", 0); leaderDot.setAttribute("opacity", 0); cardsCleared = true; }
    return;
  }
  cardsCleared = false;
  const s = camScreen.s, top = 70, pad = 16, gap = 28;
  const ht = heroTextVisible();
  let best = null, bestOp = 0.02;
  CHAPTERS.forEach((ch) => {
    const el = document.getElementById("ch-" + ch.id), size = cardSize[ch.id];
    if (!el || !size) return;
    const c = stickerScreen(ch.sticker), ext = stickerExtent(ch.sticker, s);
    const stickerBox = [c.x - ext.x - gap * 0.6, c.y - ext.y - gap * 0.6, c.x + ext.x + gap * 0.6, c.y + ext.y + gap * 0.6];
    const avoid = [stickerBox, ...(ht ? heroLineRects.map((q) => [q[0] - 14, q[1] - 10, q[2] + 14, q[3] + 10]) : [])];
    const pref = ch.card.side, al = ch.card.align ?? 0.5;
    const order = [pref, { left: "right", right: "left", above: "below", below: "above" }[pref], "above", "below", "left", "right"]
      .filter((v, i, arr) => arr.indexOf(v) === i);
    let pick = null, pickScore = Infinity;
    // each side: try the drawn alignment first, then slide along that side before giving up on it
    const tries = [];
    for (const side of order) {
      const a0 = side === pref ? al : 0.5;
      for (const d of [0, 0.15, -0.15, 0.3, -0.3, 0.45, -0.45]) { const a = a0 + d; if (a >= 0 && a <= 1) tries.push([side, a]); }
    }
    for (const [side, a] of tries) {
      let x, y;
      if (side === "left") { x = c.x - ext.x - gap - size.w; y = c.y - a * size.h; }
      else if (side === "right") { x = c.x + ext.x + gap; y = c.y - a * size.h; }
      else if (side === "above") { y = c.y - ext.y - gap - size.h; x = c.x - a * size.w; }
      else { y = c.y + ext.y + gap; x = c.x - a * size.w; }
      x = Math.min(Math.max(x, pad), view.w - pad - size.w);
      y = Math.min(Math.max(y, top), view.h - pad - size.h);
      const r = [x, y, x + size.w, y + size.h];
      const score = avoid.reduce((acc, b) => acc + Math.max(0, Math.min(r[2], b[2]) - Math.max(r[0], b[0])) * Math.max(0, Math.min(r[3], b[3]) - Math.max(r[1], b[1])), 0);
      if (score < pickScore) { pick = { x, y }; pickScore = score; }
      if (score === 0) break;
    }
    const { x, y } = pick;
    const v = `${Math.round(x)}px ${Math.round(y)}px`;
    if (el.style.translate !== v) el.style.translate = v;
    const op = el.style.visibility === "hidden" ? 0 : parseFloat(el.style.opacity || "0");
    if (op > bestOp) { bestOp = op; best = { ch, c, x, y, size }; }
  });
  // dashed line from the sticker's edge to the nearest point on its card
  let key = "off";
  if (best) {
    const { ch, c, x, y, size } = best, st = STICKERS[ch.sticker], art = ART[ch.sticker];
    const nx = Math.min(Math.max(c.x, x), x + size.w), ny = Math.min(Math.max(c.y, y), y + size.h);
    const dx = nx - c.x, dy = ny - c.y, d = Math.hypot(dx, dy) || 1;
    const r = (ch.sticker === "coffee" || ch.sticker === "badge" ? st.size / 2 : Math.max(st.size, st.size * art.vb[3] / art.vb[2]) / 2 * 0.85) * s + 6;
    if (d > r + 8) key = `${(c.x + dx / d * r).toFixed(1)},${(c.y + dy / d * r).toFixed(1)},${nx.toFixed(1)},${ny.toFixed(1)},${bestOp.toFixed(2)}`;
  }
  if (key === lastLeader) return;
  lastLeader = key;
  if (key === "off") { leaderLine.setAttribute("opacity", 0); leaderDot.setAttribute("opacity", 0); return; }
  const [x1, y1, x2, y2, op] = key.split(",").map(Number);
  leaderLine.setAttribute("x1", x1); leaderLine.setAttribute("y1", y1); leaderLine.setAttribute("x2", x2); leaderLine.setAttribute("y2", y2);
  leaderDot.setAttribute("cx", x1); leaderDot.setAttribute("cy", y1);
  leaderLine.setAttribute("opacity", op); leaderDot.setAttribute("opacity", op);
}

/* =====================================================================
   8. SCROLL STORY — one scrubbed timeline generated from CHAPTERS.
   ===================================================================== */
let chapterRanges = [], currentIdx = -2, storyST = null, mm = null;
function setActive(p) {
  let idx = -1;
  chapterRanges.forEach((r, i) => { if (p >= r.arrive) idx = i; });
  if (idx === currentIdx) return;
  currentIdx = idx;
  index.querySelectorAll("button").forEach((b, i) => { if (i === idx) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
}

/* where a world point sits on screen in the opening shot, as viewport fractions */
function heroScreenOf(pt) {
  const h = HERO.desktop, s0 = view.s0;
  return { x: (h.x * view.w - h.u * s0 + pt.x * s0) / view.w, y: (h.y * view.h - h.v * s0 + pt.y * s0) / view.h };
}

function buildStory({ mobile, reduce }) {
  const hero = mobile ? HERO.mobile : HERO.desktop;
  Object.assign(cam, { u: hero.u, v: hero.v, sx: hero.x, sy: hero.y, k: hero.zoom, fr: 4000 });
  const total = HERO_HOLD + CHAPTERS.reduce((a, c) => a + c.scroll.travel + c.scroll.hold, 0) + END_PAD;
  story.style.setProperty("--units", (total + 1).toFixed(3)); // +1: the last viewport of scroll
  const tl = gsap.timeline({ defaults: { overwrite: false } });
  tl.to({}, { duration: total }, 0);                                // fix the timeline length = scroll units
  // desktop keeps the hero copy on screen (the cards sit around the character); phones hand the screen to the zoom
  tl.to(mobile ? ["#hero", "#cue"] : ["#cue"], { autoAlpha: 0, y: -24, duration: reduce ? 0.15 : 0.4, ease: "power1.in" }, HERO_HOLD);
  let t = HERO_HOLD;
  chapterRanges = [];
  CHAPTERS.forEach((ch, i) => {
    const travel = ch.scroll.travel, move = reduce ? travel * 0.12 : travel, moveAt = reduce ? t + travel * 0.6 : t;
    let shot;
    if (mobile) {
      shot = { u: ch.target.x, v: ch.target.y, sx: ch.mobile.screen.x, sy: ch.mobile.screen.y, k: ch.mobile.zoom };
    } else {   // hold the opening framing and push in gently around the sticker, so it stays where it was
      const p = heroScreenOf(ch.target);
      shot = { u: ch.target.x, v: ch.target.y, sx: p.x, sy: p.y, k: ch.push ?? 1.08 };
    }
    tl.to(cam, { ...shot, duration: move, ease: "power2.inOut" }, moveAt);
    if (!reduce) {   // rack focus: open the sharp zone mid-move, then pull it tight on arrival
      tl.to(cam, { fr: RACK_RADIUS, duration: travel * 0.4, ease: "sine.out" }, t);
      tl.to(cam, { fr: ch.focus, duration: travel * 0.6, ease: "sine.inOut" }, t + travel * 0.4);
    } else {
      tl.to(cam, { fr: ch.focus, duration: move }, moveAt);
    }
    const panel = "#ch-" + ch.id;
    tl.fromTo(panel, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: travel * 0.3, ease: "power2.out" }, t + travel * 0.7);
    const arrive = t + travel * 0.7, end = t + travel + ch.scroll.hold;
    chapterRanges.push({ id: ch.id, start: t / total, arrive: arrive / total, end: end / total, hold: (t + travel + ch.scroll.hold * 0.4) / total });
    ch.range = [t / total, end / total];
    if (i < CHAPTERS.length - 1) tl.to(panel, { autoAlpha: 0, y: -10, duration: 0.25, ease: "power1.in" }, end);
    t = end;
  });
  storyST = ScrollTrigger.create({
    trigger: story, start: "top top", end: "bottom bottom",
    animation: tl, scrub: reduce ? true : 0.7,
    onUpdate: (self) => setActive(self.progress),
    onRefresh: (self) => setActive(self.progress),
  });
  tl.progress(storyST.progress);           // land on the current scroll position straight away (matters after a rebuild)
  setActive(storyST.progress);
  measureCards();
  return () => { storyST = null; };
}

function goTo(i) {
  if (!storyST) { document.getElementById("ch-" + CHAPTERS[i].id)?.scrollIntoView({ behavior: "smooth" }); return; }
  const top = storyST.start + (storyST.end - storyST.start) * chapterRanges[i].hold;
  window.scrollTo({ top, behavior: reduceMotionMQ.matches ? "auto" : "smooth" });
}
const onIndexClick = (e) => { const b = e.target.closest("button[data-i]"); if (b) goTo(+b.dataset.i); };
index.addEventListener("click", onIndexClick);

const onCopy = async (e) => {
  if (e.target.id !== "copy-email") return;
  const btn = e.target, text = $("#email").textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch { const r = document.createRange(); r.selectNodeContents($("#email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected"; }
  setTimeout(() => { btn.textContent = btn.dataset.label || "Copy email"; }, 1800);
};
story.addEventListener("click", onCopy);

function setupStory() {
  mm?.revert();
  mm = gsap.matchMedia();
  mm.add({ mobile: "(max-width: 720px)", desktop: "(min-width: 721px)", reduce: "(prefers-reduced-motion: reduce)" },
    (ctx) => buildStory(ctx.conditions));
}
// desktop shots depend on the viewport's shape, so rebuild them after a resize settles
let rebuildTimer = 0, builtFor = "";
function scheduleRebuild() {
  if (!window.gsap || view.mobile) return;
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(() => {
    const key = view.w + "x" + view.h;
    if (key === builtFor) return;
    builtFor = key; setupStory(); ScrollTrigger.refresh();
  }, 220);
}
if (window.gsap && window.ScrollTrigger) {
  gsap.registerPlugin(ScrollTrigger);
  ScrollTrigger.config({ ignoreMobileResize: true });
  setupStory();
  builtFor = view.w + "x" + view.h;
} else {
  document.documentElement.classList.add("static");
  console.warn("[story] GSAP unavailable — showing chapters as a static column.");
}

/* =====================================================================
   9. RENDER LOOP + RESIZE + CLEANUP
   ===================================================================== */
let raf = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  applyCamera();
  updateEyes(dt);
  updateFace(dt);
  flames?.frame(dt, reduceMotionMQ.matches);
  positionCards();
  raf = requestAnimationFrame(frame);
}
raf = requestAnimationFrame(frame);
const onResize = () => { measure(); lastCam = ""; flames?.resize(view.w, view.h); measureHero(); measureCards(); scheduleRebuild(); };
window.addEventListener("resize", onResize, { passive: true });
window.visualViewport?.addEventListener("resize", onResize, { passive: true });

window.stickerPortfolio = {
  chapters: CHAPTERS, cam, view, camScreen, eyeState, gestures, flames, get warp() { return warp; },
  destroy() {
    cancelAnimationFrame(raf); gaze.destroy(); mm?.revert(); warp?.destroy(); flames?.destroy();
    window.removeEventListener("resize", onResize); window.visualViewport?.removeEventListener("resize", onResize);
    index.removeEventListener("click", onIndexClick); story.removeEventListener("click", onCopy);
  },
};
})();
</script>

</body>
</html>
